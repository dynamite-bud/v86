[package]
name = "v86"
version = "0.1.0"
publish = false
edition = "2021"

[features]
default = []
profiler = []
# XWAH-9 Phase 3: guest RAM as an imported second wasm memory (Stage 4 flips
# the runtime onto it; Stage 2's wasm_builder support is gated on it or test)
guest-ram-import = []

[lib]
crate-type = ["cdylib"]
path = "src/rust/lib.rs"

[profile.test]
lto = false
opt-level = 2
overflow-checks = false

[profile.dev]
lto = true
opt-level = 2
panic = "abort"
overflow-checks = false

[profile.release]
lto = true
opt-level = 3
incremental = false
panic = "abort"
