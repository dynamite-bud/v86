<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v86 Ghostty Codex appliance</title>
<style>
    :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
    }
    body {
        margin: 0;
        background: #17191d;
        color: #f1f3f5;
    }
    header {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #25282e;
        border-bottom: 1px solid #3b3f47;
    }
    h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
    }
    nav {
        display: flex;
        gap: 8px;
    }
    nav a, button {
        padding: 6px 10px;
        border: 1px solid #676e7a;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        text-decoration: none;
    }
    nav a[aria-current="page"] {
        background: #3f6eb3;
        border-color: #74a4eb;
    }
    main {
        width: min(1920px, 100%);
        margin: 16px auto;
    }
    #status, #network-status, #clipboard-status {
        margin: 0 0 8px;
        color: #cbd1da;
        font: 13px ui-monospace, monospace;
    }
    #controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
    }
    #control-buttons {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    #screen_container {
        position: relative;
        width: 1920px;
        height: auto;
        aspect-ratio: 16 / 9;
        max-width: 100%;
        overflow: hidden;
        background: #000;
        box-shadow: 0 8px 32px #0009;
        cursor: none !important;
    }
    #screen_container .v86-virtio-gpu-cursor {
        display: none !important;
    }
    #screen_container > div {
        white-space: pre;
        font: 14px monospace;
        line-height: 14px;
    }
    #screen_container > canvas.legacy-vga {
        display: none;
    }
    #screen_container canvas {
        max-width: 100%;
        height: auto;
        image-rendering: auto;
    }
    details {
        margin-top: 10px;
        color: #aeb5c0;
    }
    pre {
        max-height: 240px;
        overflow: auto;
        padding: 8px;
        background: #101216;
        white-space: pre-wrap;
    }
    @media (max-width: 720px) {
        header {
            align-items: flex-start;
            flex-direction: column;
        }
        main {
            margin-top: 8px;
        }
    }
</style>
<header>
    <h1>Ghostty + Codex appliance</h1>
    <nav aria-label="GPU renderer">
        <a id="webgpu-js-link" href="?renderer=webgpu-js">Direct JavaScript</a>
        <a id="wgpu-link" href="?renderer=wgpu">Rust/Wasm wgpu</a>
    </nav>
</header>
<main>
    <p id="status">Preparing emulator…</p>
    <div id="controls">
        <p id="network-status"></p>
        <div id="control-buttons">
            <span id="clipboard-status" role="status" aria-live="polite"></span>
            <button id="paste-clipboard" type="button">Paste</button>
            <button id="reset-session" type="button">Reset fresh session</button>
        </div>
    </div>
    <div id="screen_container" tabindex="0" aria-label="Codex appliance display">
        <div></div>
        <canvas class="legacy-vga"></canvas>
    </div>
    <details>
        <summary>Serial readiness log</summary>
        <pre id="serial"></pre>
    </details>
</main>
<script type="module">
import { V86 } from "../build/libv86.mjs";
import { create_ready_state_fingerprint } from "../src/browser/ready_state_snapshot.js";

const params = new URLSearchParams(location.search);
const preset = params.get("preset");
const snapshot_mode = params.get("snapshot") || "off";
const hosted_snapshot_requested = snapshot_mode === "hosted";
const hosted_snapshot_capture = snapshot_mode === "capture";
const hosted_snapshot_flow = hosted_snapshot_requested || hosted_snapshot_capture;
const multi_core_accelerated =
    preset === "multi-core-accelerated" || hosted_snapshot_flow;
const renderer = multi_core_accelerated || params.get("renderer") === "wgpu" ?
    "wgpu" : "webgpu-js";
const relay_url = params.get("relay");
const shader = params.get("shader") === "1";
const resources = params.get("resources") === "1";
const mesa = params.get("mesa") === "1";
const accelerated = renderer === "wgpu" &&
    (multi_core_accelerated || params.get("accelerated") === "1");
const triangle = params.get("triangle") === "1" || shader || resources || mesa || accelerated;
const benchmark_enabled = params.get("benchmark") === "1";
const benchmark_runner = benchmark_enabled ?
    (await import("../tests/benchmark/virtio-gpu-codex.js"))
        .create_virtio_gpu_codex_benchmark({
            renderer,
            accelerated,
            machine: params.get("benchmark_machine"),
        }) :
    null;
const cpus = multi_core_accelerated ? 4 :
    Math.min(255, Math.max(1, parseInt(params.get("cpus"), 10) || 1));
const smp_workers = multi_core_accelerated || params.get("workers") === "1";
const smp_memory_model = multi_core_accelerated ? "relaxed" :
    params.get("mm") === "fenced" ? "fenced" : "relaxed";
const renderer_label = renderer === "wgpu" ? "Rust/Wasm wgpu" : "direct JavaScript WebGPU";
const status = document.getElementById("status");
const serial = document.getElementById("serial");
const network_status = document.getElementById("network-status");
const clipboard_status = document.getElementById("clipboard-status");
const paste_button = document.getElementById("paste-clipboard");
const reset_button = document.getElementById("reset-session");
const screen_container = document.getElementById("screen_container");
const renderer_link = document.getElementById(`${renderer}-link`);
renderer_link.setAttribute("aria-current", "page");

for(const name of ["webgpu-js", "wgpu"])
{
    const link = document.getElementById(`${name}-link`);
    const url = new URL(location.href);
    if(multi_core_accelerated)
    {
        url.searchParams.delete("preset");
        url.searchParams.delete("snapshot");
    }
    url.searchParams.set("renderer", name);
    if(params.has("relay"))
    {
        url.searchParams.set("relay", relay_url);
    }
    if(benchmark_enabled)
    {
        url.searchParams.set("benchmark", "1");
    }
    link.href = url.search;
}

reset_button.addEventListener("click", () => {
    const url = new URL(location.href);
    url.searchParams.set("snapshot", "off");
    location.href = url.href;
});
const clipboard_text_limit = 64 * 1024;
paste_button.addEventListener("click", async () => {
    clipboard_status.textContent = "";
    if(!navigator.clipboard || typeof navigator.clipboard.readText !== "function")
    {
        clipboard_status.textContent =
            "Clipboard access is unavailable. Focus the display and use Cmd/Ctrl+V.";
        return;
    }

    try
    {
        const text = await navigator.clipboard.readText();
        if(!text)
        {
            clipboard_status.textContent = "Clipboard is empty.";
            return;
        }

        const bounded_text = text.length > clipboard_text_limit ?
            text.slice(0, clipboard_text_limit) : text;
        await emulator.keyboard_send_text(bounded_text, 1);
        screen_container.focus();
        clipboard_status.textContent = text.length > clipboard_text_limit ?
            `Pasted the first ${clipboard_text_limit} characters (clipboard text was truncated).` :
            `Pasted ${bounded_text.length} character${bounded_text.length === 1 ? "" : "s"}.`;
    }
    catch(error)
    {
        const reason = error && error.name === "NotAllowedError" ?
            "Clipboard permission was denied." : "Clipboard access failed.";
        clipboard_status.textContent =
            `${reason} Focus the display and use Cmd/Ctrl+V.`;
    }
});
network_status.textContent = relay_url ?
    "VirtIO NIC relay: configured" :
    "VirtIO NIC relay: unconfigured";

const memory_size = 2 * 1024 * 1024 * 1024;
const vga_memory_size = 8 * 1024 * 1024;
const filesystem_size = 2 * 1024 * 1024 * 1024;
const width = 1920;
const height = 1080;
const relay_state = relay_url ? "configured" : "unconfigured";
const filesystem_prefix = multi_core_accelerated ?
    "virtio-gpu-multi-core-alpine-codex" : "alpine-virtio-gpu-codex";
const gpu_modes = [];
if(benchmark_enabled) gpu_modes.push("v86_gpu_benchmark=1");
if(accelerated) gpu_modes.push("v86_gpu_accelerated=1");
else if(mesa) gpu_modes.push("v86_gpu_mesa=1");
else if(resources) gpu_modes.push("v86_gpu_resources=1");
else if(shader) gpu_modes.push("v86_gpu_shader=1");
else if(triangle) gpu_modes.push("v86_gpu_triangle=1");
if(multi_core_accelerated) gpu_modes.push(`v86_cpus=${cpus}`);
const gpu_cmdline = gpu_modes.map(mode => ` ${mode}`).join("");
const cold_cmdline = `rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose modules=virtio_pci console=ttyS0,115200 tsc=reliable v86_relay=${relay_state}${gpu_cmdline}`;
const snapshot_cmdline = `${cold_cmdline} v86_snapshot_capture=1`;
const hosted_snapshot_schema = 1;
const hosted_snapshot_manifest_url =
    "../images/virtio-gpu-multi-core-alpine-codex-ready-state.json";
const hosted_snapshot_configuration = {
    schema: hosted_snapshot_schema,
    protocol: "pre-ghostty-v1",
    variant: "virtio-gpu-multi-core-alpine-codex",
    renderer,
    relay_state,
    memory_size,
    vga_memory_size,
    filesystem_size,
    width,
    height,
    cpus,
    smp_workers,
    smp_memory_model,
    acpi: cpus > 1,
    cmdline: snapshot_cmdline,
    wasm_path: "../build/v86-multimem.wasm",
    smp_worker_url: "../src/browser/vcpu_worker.js",
    filesystem_prefix,
    experimental_3d: triangle,
};
const hosted_snapshot_assets = [
    "../build/libv86.mjs",
    "../build/v86-multimem.wasm",
    "../build/gram.wasm",
    "../build/gram-shared.wasm",
    "../src/browser/vcpu_worker.js",
    "../bios/seabios.bin",
    "../bios/vgabios.bin",
    `../images/${filesystem_prefix}-fs.json`,
    `../images/${filesystem_prefix}-image-contract.json`,
    "../build/virtio-gpu-wgpu/virtio_gpu_wgpu.js",
    "../build/virtio-gpu-wgpu/virtio_gpu_wgpu_bg.wasm",
];
let hosted_snapshot_fingerprint = null;
let hosted_snapshot_manifest = null;
let hosted_snapshot_state = null;
let hosted_snapshot_fallback_reason = null;
if(hosted_snapshot_flow)
{
    status.textContent = hosted_snapshot_capture ?
        "Preparing the accelerated pre-Ghostty snapshot checkpoint…" :
        "Checking the local accelerated ready-state snapshot…";
    hosted_snapshot_fingerprint = await create_ready_state_fingerprint(
        hosted_snapshot_configuration, hosted_snapshot_assets);
}
if(hosted_snapshot_requested)
{
    try
    {
        const manifest_response = await fetch(hosted_snapshot_manifest_url, {
            cache: "no-cache",
        });
        if(!manifest_response.ok)
        {
            throw new Error(`manifest HTTP ${manifest_response.status}`);
        }
        hosted_snapshot_manifest = await manifest_response.json();
        if(hosted_snapshot_manifest.schema !== hosted_snapshot_schema ||
           hosted_snapshot_manifest.fingerprint !== hosted_snapshot_fingerprint ||
           !hosted_snapshot_manifest.state ||
           typeof hosted_snapshot_manifest.state.url !== "string" ||
           typeof hosted_snapshot_manifest.state.sha256 !== "string")
        {
            throw new Error("manifest is incompatible with this appliance build");
        }
        const state_response = await fetch(hosted_snapshot_manifest.state.url, {
            cache: "force-cache",
        });
        if(!state_response.ok)
        {
            throw new Error(`state HTTP ${state_response.status}`);
        }
        hosted_snapshot_state = await state_response.arrayBuffer();
        const state_sha256 = await sha256_hex(hosted_snapshot_state);
        if(state_sha256 !== hosted_snapshot_manifest.state.sha256)
        {
            throw new Error("state checksum does not match its manifest");
        }
    }
    catch(error)
    {
        hosted_snapshot_state = null;
        hosted_snapshot_fallback_reason = error_message(error);
    }
}
const hosted_snapshot_restored = hosted_snapshot_state !== null;
const cmdline = hosted_snapshot_capture || hosted_snapshot_restored ?
    snapshot_cmdline : cold_cmdline;

const emulator = new V86({
    wasm_path: smp_workers ? "../build/v86-multimem.wasm" : "../build/v86.wasm",
    memory_size,
    vga_memory_size,
    cpus,
    ...(smp_workers ? {
        smp_workers: true,
        smp_worker_url: "../src/browser/vcpu_worker.js",
        smp_memory_model,
    } : {}),
    // cpus > 1 requires acpi (the LAPIC MMIO window is gated on it);
    // keep the appliance's historical acpi-less setup for one CPU
    acpi: cpus > 1,
    bios: { url: "../bios/seabios.bin" },
    vga_bios: { url: "../bios/vgabios.bin" },
    filesystem: {
        baseurl: `../images/${filesystem_prefix}-rootfs-flat`,
        basefs: `../images/${filesystem_prefix}-fs.json`,
        total_size: filesystem_size,
    },
    screen_container,
    autostart: true,
    bzimage_initrd_from_filesystem: true,
    cmdline,
    ...(hosted_snapshot_restored ? {
        initial_state: { buffer: hosted_snapshot_state },
    } : {}),
    ...(relay_url ? {
        net_device: {
            type: "virtio",
            relay_url,
        },
    } : {}),
    virtio_gpu: {
        backend: renderer,
        experimental_3d: triangle,
        width,
        height,
        ...(renderer === "wgpu" ? {
            wasm_module_url: "../build/virtio-gpu-wgpu/virtio_gpu_wgpu.js",
        } : {}),
    },
});

window.emulator = emulator;
window.webgpuBackend = renderer;
window.applianceSessionId = crypto.randomUUID();
window.virtioGpuBenchmark = benchmark_runner;
window.appliancePreset = preset;
const snapshot_started = performance.now();
window.applianceHostedSnapshot = {
    capture: capture_hosted_snapshot,
    release: release_hosted_snapshot,
    mode: snapshot_mode,
    requested: hosted_snapshot_requested,
    restored: hosted_snapshot_restored,
    checkpoint_ready: false,
    release_sent: false,
    fallback_reason: hosted_snapshot_fallback_reason,
    fingerprint: hosted_snapshot_fingerprint,
    manifest: hosted_snapshot_manifest,
    capture_metadata: null,
    ready_ms: null,
};
const boot_label = `${renderer_label}, ${cpus} cpu${cpus > 1 ? "s" : ""}`;
status.textContent = hosted_snapshot_restored ?
    `Restoring the accelerated four-vCPU appliance snapshot (${boot_label})…` :
    hosted_snapshot_capture ?
        `Booting the accelerated snapshot checkpoint (${boot_label})…` :
        hosted_snapshot_fallback_reason ?
            `Hosted snapshot unavailable (${hosted_snapshot_fallback_reason}); cold booting (${boot_label})…` :
            multi_core_accelerated ?
                `Booting accelerated four-vCPU Alpine Ghostty (${boot_label})…` :
                accelerated ?
                    `Booting accelerated Alpine Openbox, Ghostty, and Codex (${boot_label})…` :
                    benchmark_enabled ?
                        `Booting the deterministic Ghostty benchmark (${boot_label})…` :
                        resources ?
                            `Booting the capset-7 llvmpipe/resource triangle (${boot_label})…` :
                            shader ?
                                `Booting the capset-7 version-2 guest shader (${boot_label})…` :
                                triangle ?
                                    `Booting the capset-7 reference triangle (${boot_label})…` :
                                    `Booting Alpine Openbox, Ghostty, and Codex (${boot_label})…`;
if(benchmark_runner)
{
    benchmark_runner.run(emulator);
}
emulator.add_listener("emulator-loaded", () => {
    if(!hosted_snapshot_restored)
    {
        return;
    }
    hosted_snapshot_state = null;
    release_hosted_snapshot().catch(error => {
        status.textContent = `Snapshot release failed: ${error_message(error)}`;
        document.body.dataset.result = "fail";
        console.error(error);
    });
});

async function release_hosted_snapshot()
{
    if(!hosted_snapshot_restored &&
       !window.applianceHostedSnapshot.checkpoint_ready)
    {
        throw new Error("The pre-Ghostty snapshot checkpoint is not ready");
    }
    emulator.serial0_send("touch /tmp/v86-appliance-snapshot-release\n");
    window.applianceHostedSnapshot.release_sent = true;
    if(!emulator.is_running())
    {
        await emulator.run();
    }
}

async function capture_hosted_snapshot()
{
    if(!hosted_snapshot_capture ||
       !window.applianceHostedSnapshot.checkpoint_ready)
    {
        throw new Error("The pre-Ghostty snapshot checkpoint is not ready");
    }
    const device = emulator.v86.cpu.devices.virtio_gpu;
    const stats = device.get_performance_stats();
    if(stats.live_3d_contexts !== 0 || stats.live_3d_resources !== 0 ||
       stats.context_attachments !== 0)
    {
        throw new Error("The snapshot checkpoint still owns live 3D state");
    }
    const canvas = document.querySelector(".v86-virtio-gpu-canvas");
    if(!canvas || canvas.hidden || getComputedStyle(canvas).display === "none")
    {
        throw new Error("The snapshot checkpoint has no visible scanout");
    }
    const was_running = emulator.is_running();
    let state = null;
    let completed = false;
    try
    {
        if(was_running)
        {
            await emulator.stop();
        }
        state = await emulator.save_state();
        const header = new DataView(state, 0, 16);
        const metadata = {
            fingerprint: hosted_snapshot_fingerprint,
            raw_bytes: state.byteLength,
            state_version: header.getInt32(4, true),
            smp_mode: emulator.smp_mode,
            gpu: {
                live_3d_contexts: stats.live_3d_contexts,
                live_3d_resources: stats.live_3d_resources,
                context_attachments: stats.context_attachments,
            },
        };
        const response = await fetch("/__v86_hosted_snapshot", {
            method: "POST",
            headers: {
                "Content-Type": "application/octet-stream",
                "X-V86-Snapshot-Metadata": JSON.stringify(metadata),
            },
            body: state,
        });
        if(!response.ok)
        {
            throw new Error(`Snapshot upload failed with HTTP ${response.status}`);
        }
        const result = await response.json();
        window.applianceHostedSnapshot.capture_metadata = {
            ...metadata,
            ...result,
        };
        completed = true;
        return window.applianceHostedSnapshot.capture_metadata;
    }
    finally
    {
        state = null;
        if(was_running && !completed)
        {
            await emulator.run();
        }
    }
}


let serial_text = "";
let serial_render_pending = false;
let guest_ready = false;
let readiness_timer;


function update_readiness()
{
    if(serial_text.includes("V86_APPLIANCE_READY=FAIL"))
    {
        status.textContent = "The appliance failed its guest readiness contract. Open the serial log.";
        document.body.dataset.result = "fail";
        clearInterval(readiness_timer);
        return;
    }
    if(document.body.dataset.result)
    {
        clearInterval(readiness_timer);
        return;
    }
    if(!guest_ready)
    {
        return;
    }
    const canvas = document.querySelector(".v86-virtio-gpu-canvas");
    if(canvas && !canvas.hidden && getComputedStyle(canvas).display !== "none")
    {
        status.textContent = accelerated ?
            benchmark_enabled ?
                `Running the accelerated Ghostty benchmark (${renderer_label})…` :
                `Ghostty is ready (${renderer_label}); run codex to start Codex.` :
            triangle ?
                `Reference triangle is ready (${renderer_label}).` :
                benchmark_enabled ?
                    `Running the deterministic Ghostty benchmark (${renderer_label})…` :
                    `Ghostty is ready (${renderer_label}); run codex to start Codex.`;
        document.body.dataset.result = "pass";
        document.body.dataset.snapshotRestore =
            hosted_snapshot_restored ? "pass" : "none";
        window.applianceHostedSnapshot.ready_ms =
            Math.round(performance.now() - snapshot_started);
        clearInterval(readiness_timer);
    }
    else
    {
        status.textContent = "Guest ready; waiting for its WebGPU scanout…";
    }
}

readiness_timer = setInterval(update_readiness, 250);
emulator.add_listener("serial0-output-byte", byte => {
    serial_text += String.fromCharCode(byte);
    window.applianceSerialText = serial_text;
    if(serial_text.length > 30000)
    {
        serial_text = serial_text.slice(-24000);
    }
    if(!serial_render_pending)
    {
        serial_render_pending = true;
        requestAnimationFrame(() => {
            serial.textContent = serial_text;
            serial_render_pending = false;
        });
    }
    if(!window.applianceHostedSnapshot.checkpoint_ready &&
       serial_text.includes("V86_APPLIANCE_SNAPSHOT_READY=PASS"))
    {
        window.applianceHostedSnapshot.checkpoint_ready = true;
        if(hosted_snapshot_capture)
        {
            status.textContent =
                "Accelerated pre-Ghostty checkpoint ready for local capture.";
        }
    }
    if(!guest_ready && serial_text.includes("V86_APPLIANCE_READY=PASS"))
    {
        guest_ready = true;
        update_readiness();
    }
    else if(serial_text.includes("V86_APPLIANCE_READY=FAIL"))
    {
        update_readiness();
    }
});

async function sha256_hex(value)
{
    const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", value));
    let result = "";
    for(const byte of digest)
    {
        result += byte.toString(16).padStart(2, "0");
    }
    return result;
}

function error_message(error)
{
    return error instanceof Error ? error.message : String(error);
}

window.addEventListener("unhandledrejection", event => {
    status.textContent = `Emulator failure: ${event.reason}`;
    document.body.dataset.result = "fail";
});
</script>
