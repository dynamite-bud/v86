<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v86 Alpine XFCE on virtio-gpu WebGPU</title>
<style>
    :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
    }
    body {
        margin: 0;
        background: #17191d;
        color: #f1f3f5;
    }
    header {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #25282e;
        border-bottom: 1px solid #3b3f47;
    }
    h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
    }
    nav {
        display: flex;
        gap: 8px;
    }
    nav a {
        padding: 6px 10px;
        border: 1px solid #676e7a;
        border-radius: 4px;
        color: inherit;
        text-decoration: none;
    }
    nav a[aria-current="page"] {
        background: #3f6eb3;
        border-color: #74a4eb;
    }
    main {
        width: min(1024px, 100%);
        margin: 16px auto;
    }
    #status {
        margin: 0 0 8px;
        color: #cbd1da;
        font: 13px ui-monospace, monospace;
    }
    #snapshot-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 0 0 10px;
    }
    #snapshot-controls button {
        padding: 6px 10px;
    }
    #snapshot-controls button:disabled {
        opacity: 0.55;
    }
    #snapshot-status {
        color: #aeb5c0;
        font: 12px ui-monospace, monospace;
    }
    #screen_container {
        position: relative;
        width: 1024px;
        height: 768px;
        max-width: 100%;
        overflow: hidden;
        background: #000;
        box-shadow: 0 8px 32px #0009;
    }
    #screen_container > div {
        white-space: pre;
        font: 14px monospace;
        line-height: 14px;
    }
    #screen_container > canvas.legacy-vga {
        display: none;
    }
    #screen_container canvas {
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
    }
    details {
        margin-top: 10px;
        color: #aeb5c0;
    }
    pre {
        max-height: 240px;
        overflow: auto;
        padding: 8px;
        background: #101216;
        white-space: pre-wrap;
    }
</style>
<header>
    <h1>Alpine XFCE on virtio-gpu WebGPU</h1>
    <nav aria-label="Desktop session">
        <a id="xorg-link" href="?desktop=xorg">Xorg</a>
        <a id="wayland-link" href="?desktop=wayland">Wayland</a>
    </nav>
    <nav aria-label="GPU renderer">
        <a id="webgpu-js-link" href="?renderer=webgpu-js">Direct JavaScript</a>
        <a id="wgpu-link" href="?renderer=wgpu">Rust/Wasm wgpu</a>
    </nav>
</header>
<main>
    <p id="status">Preparing emulator…</p>
    <div id="snapshot-controls">
        <button id="save-snapshot" type="button" disabled>Save ready snapshot</button>
        <button id="clear-snapshot" type="button" disabled>Delete saved snapshot</button>
        <span id="snapshot-status" role="status">Checking snapshot support…</span>
    </div>
    <div id="screen_container">
        <div></div>
        <canvas class="legacy-vga"></canvas>
    </div>
    <details>
        <summary>Serial console</summary>
        <pre id="serial"></pre>
    </details>
</main>
<script type="module">
import { V86 } from "../build/libv86.mjs";
import {
    READY_STATE_SNAPSHOT_SCHEMA,
    ReadyStateSnapshotStore,
    create_ready_state_fingerprint,
} from "../src/browser/ready_state_snapshot.js";

const params = new URLSearchParams(location.search);
const mode = params.get("desktop") === "wayland" ? "wayland" : "xorg";
const renderer = params.get("renderer") === "wgpu" ? "wgpu" : "webgpu-js";
const benchmark = params.has("benchmark") ?
    (await import("../tests/benchmark/virtio-gpu-desktop.js"))
        .create_virtio_gpu_desktop_benchmark({
            mode,
            renderer,
            duration_ms: Number(params.get("benchmark")),
            warmup_ms: params.has("benchmark_warmup") ?
                Number(params.get("benchmark_warmup")) : undefined,
            machine: params.get("benchmark_machine"),
        }) :
    null;
const renderer_label = renderer === "wgpu" ? "Rust/Wasm wgpu" : "direct JavaScript WebGPU";
const status = document.getElementById("status");
const serial = document.getElementById("serial");
const snapshot_status = document.getElementById("snapshot-status");
const save_snapshot_button = document.getElementById("save-snapshot");
const clear_snapshot_button = document.getElementById("clear-snapshot");
document.getElementById(`${mode}-link`).setAttribute("aria-current", "page");
document.getElementById(`${renderer}-link`).setAttribute("aria-current", "page");
document.getElementById("xorg-link").href = `?desktop=xorg&renderer=${renderer}`;
document.getElementById("wayland-link").href = `?desktop=wayland&renderer=${renderer}`;
document.getElementById("webgpu-js-link").href = `?desktop=${mode}&renderer=webgpu-js`;
document.getElementById("wgpu-link").href = `?desktop=${mode}&renderer=wgpu`;

const memory_size = 2 * 1024 * 1024 * 1024;
const vga_memory_size = 8 * 1024 * 1024;
const filesystem_size = 2 * 1024 * 1024 * 1024;
const width = 1024;
const height = 768;
const cmdline = `rw root=host9p rootfstype=9p rootflags=trans=virtio,cache=loose modules=virtio_pci console=ttyS0,115200 tsc=reliable v86.desktop=${mode}`;
const snapshots_available = !benchmark;
const snapshot_restore_enabled = snapshots_available && params.get("snapshot") !== "off";
const snapshot_key = `alpine-xfce-ready-v${READY_STATE_SNAPSHOT_SCHEMA}:${mode}:${renderer}`;
const snapshot_configuration = {
    mode,
    renderer,
    memory_size,
    vga_memory_size,
    filesystem_size,
    width,
    height,
    cmdline,
};
const snapshot_assets = [
    "../build/libv86.mjs",
    "../build/v86.wasm",
    "../bios/seabios.bin",
    "../bios/vgabios.bin",
    "../images/alpine-virtio-gpu-desktop-fs.json",
    ...(renderer === "wgpu" ? [
        "../build/virtio-gpu-wgpu/virtio_gpu_wgpu.js",
        "../build/virtio-gpu-wgpu/virtio_gpu_wgpu_bg.wasm",
    ] : []),
];
let snapshot_store = null;
let snapshot_fingerprint = null;
let snapshot_metadata = null;
let restored_snapshot = null;
if(snapshots_available)
{
    status.textContent = snapshot_restore_enabled ?
        "Checking for a compatible ready-state snapshot…" :
        "Snapshot restore skipped; starting a cold boot…";
    snapshot_store = new ReadyStateSnapshotStore(snapshot_key);
    try
    {
        snapshot_fingerprint = await create_ready_state_fingerprint(
            snapshot_configuration, snapshot_assets);
        if(snapshot_restore_enabled)
        {
            try
            {
                restored_snapshot = await snapshot_store.load(snapshot_fingerprint);
                snapshot_metadata = restored_snapshot && restored_snapshot.metadata;
                snapshot_status.textContent = restored_snapshot ?
                    `Loading snapshot saved ${new Date(snapshot_metadata.created_at).toLocaleString()}…` :
                    "No compatible snapshot saved. Boot once, then save it here.";
            }
            catch(error)
            {
                await snapshot_store.delete().catch(() => {});
                snapshot_status.textContent =
                    `Discarded an invalid snapshot: ${error_message(error)}`;
            }
        }
        else
        {
            snapshot_metadata = await snapshot_store.get_metadata();
            snapshot_status.textContent = snapshot_metadata ?
                "Saved snapshot bypassed. Delete it here or reload without snapshot=off." :
                "Snapshot restore disabled by snapshot=off.";
        }
        clear_snapshot_button.disabled = !snapshot_metadata;
    }
    catch(error)
    {
        snapshot_store = null;
        snapshot_status.textContent = `Snapshots unavailable: ${error_message(error)}`;
    }
}
else
{
    snapshot_status.textContent = "Snapshots are disabled during benchmarks.";
}

const initial_state = restored_snapshot ? { buffer: restored_snapshot.state } : null;
const emulator = new V86({
    wasm_path: "../build/v86.wasm",
    memory_size,
    vga_memory_size,
    bios: { url: "../bios/seabios.bin" },
    vga_bios: { url: "../bios/vgabios.bin" },
    filesystem: {
        baseurl: "../images/alpine-virtio-gpu-desktop-rootfs-flat",
        basefs: "../images/alpine-virtio-gpu-desktop-fs.json",
        total_size: filesystem_size,
    },
    screen_container: document.getElementById("screen_container"),
    autostart: true,
    bzimage_initrd_from_filesystem: true,
    cmdline,
    ...(initial_state ? { initial_state } : {}),
    virtio_gpu: {
        backend: renderer,
        width,
        height,
        ...(renderer === "wgpu" ? {
            wasm_module_url: "../build/virtio-gpu-wgpu/virtio_gpu_wgpu.js",
        } : {}),
    },
});

window.emulator = emulator;
window.desktopMode = mode;
window.webgpuBackend = renderer;
if(benchmark)
{
    window.virtioGpuBenchmark = benchmark;
    benchmark.run(emulator);
}
status.textContent = restored_snapshot ?
    `Restoring Alpine XFCE (${mode}, ${renderer_label}) from its saved ready state…` :
    `Booting Alpine XFCE (${mode}, ${renderer_label})…`;
let serial_text = "";
let serial_render_pending = false;
let guest_ready = !!restored_snapshot;
let readiness_timer;
function update_readiness()
{
    if(document.body.dataset.result)
    {
        clearInterval(readiness_timer);
        return;
    }
    if(serial_text.includes("V86_DESKTOP_READY=FAIL"))
    {
        status.textContent = `Alpine XFCE (${mode}) failed to start. Open the serial console for details.`;
        document.body.dataset.result = "fail";
        clearInterval(readiness_timer);
        return;
    }
    if(!guest_ready)
    {
        return;
    }
    const canvas = document.querySelector(".v86-virtio-gpu-canvas");
    if(canvas && !canvas.hidden && getComputedStyle(canvas).display !== "none")
    {
        status.textContent = restored_snapshot ?
            `Alpine XFCE (${mode}) restored from its ready snapshot. Click the desktop to interact.` :
            `Alpine XFCE (${mode}) is ready. Click the desktop to interact.`;
        document.body.dataset.result = "pass";
        document.body.dataset.snapshotRestore = restored_snapshot ? "pass" : "none";
        save_snapshot_button.disabled = !snapshot_store;
        clear_snapshot_button.disabled = !snapshot_metadata;
        if(restored_snapshot)
        {
            snapshot_status.textContent =
                `Restored ${format_bytes(snapshot_metadata.stored_bytes)} snapshot from ` +
                new Date(snapshot_metadata.created_at).toLocaleString() + ".";
            restored_snapshot.state = null;
            initial_state.buffer = null;
        }
        clearInterval(readiness_timer);
    }
    else
    {
        status.textContent = restored_snapshot ?
            `Snapshot loaded; waiting for its WebGPU scanout…` :
            `Alpine XFCE (${mode}) started; waiting for its WebGPU scanout…`;
    }
}
readiness_timer = setInterval(update_readiness, 250);
emulator.add_listener("serial0-output-byte", byte => {
    serial_text += String.fromCharCode(byte);
    if(serial_text.length > 20000)
    {
        serial_text = serial_text.slice(-16000);
    }
    if(!serial_render_pending)
    {
        serial_render_pending = true;
        requestAnimationFrame(() => {
            serial.textContent = serial_text;
            serial_render_pending = false;
        });
    }
    if(!guest_ready && serial_text.includes("V86_DESKTOP_READY=PASS"))
    {
        guest_ready = true;
        update_readiness();
    }
    else if(serial_text.includes("V86_DESKTOP_READY=FAIL"))
    {
        update_readiness();
    }
});

function error_message(error)
{
    return error instanceof Error ? error.message : String(error);
}

function format_bytes(bytes)
{
    if(!Number.isFinite(bytes))
    {
        return "unknown-size";
    }
    const units = ["B", "KiB", "MiB", "GiB"];
    let value = bytes;
    let unit = 0;
    while(value >= 1024 && unit < units.length - 1)
    {
        value /= 1024;
        unit++;
    }
    return `${value.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
}

async function save_ready_snapshot()
{
    if(!snapshot_store || !snapshot_fingerprint)
    {
        throw new Error("Persistent snapshots are unavailable");
    }
    if(document.body.dataset.result !== "pass")
    {
        throw new Error("The desktop must be ready before it can be saved");
    }
    save_snapshot_button.disabled = true;
    clear_snapshot_button.disabled = true;
    const was_running = emulator.is_running();
    let state = null;
    try
    {
        snapshot_status.textContent = "Pausing and capturing the ready desktop…";
        if(was_running)
        {
            await emulator.stop();
        }
        state = await emulator.save_state();
        snapshot_status.textContent =
            `Compressing and storing ${format_bytes(state.byteLength)}…`;
        await new Promise(resolve => requestAnimationFrame(resolve));
        snapshot_metadata = await snapshot_store.save(snapshot_fingerprint, state);
        snapshot_status.textContent =
            `Saved ${format_bytes(snapshot_metadata.stored_bytes)} snapshot at ` +
            new Date(snapshot_metadata.created_at).toLocaleString() + ".";
        clear_snapshot_button.disabled = false;
        return snapshot_metadata;
    }
    catch(error)
    {
        snapshot_status.textContent = `Snapshot save failed: ${error_message(error)}`;
        throw error;
    }
    finally
    {
        state = null;
        if(was_running)
        {
            await emulator.run();
        }
        save_snapshot_button.disabled = false;
        clear_snapshot_button.disabled = !snapshot_metadata;
    }
}

async function clear_ready_snapshot()
{
    if(!snapshot_store)
    {
        return;
    }
    save_snapshot_button.disabled = true;
    clear_snapshot_button.disabled = true;
    try
    {
        await snapshot_store.delete();
        snapshot_metadata = null;
        snapshot_status.textContent =
            "Saved snapshot deleted. The next reload will perform a cold boot.";
    }
    catch(error)
    {
        snapshot_status.textContent = `Snapshot deletion failed: ${error_message(error)}`;
        throw error;
    }
    finally
    {
        save_snapshot_button.disabled = document.body.dataset.result !== "pass";
        clear_snapshot_button.disabled = !snapshot_metadata;
    }
}

save_snapshot_button.addEventListener("click", () => {
    save_ready_snapshot().catch(error => console.error(error));
});
clear_snapshot_button.addEventListener("click", () => {
    clear_ready_snapshot().catch(error => console.error(error));
});
window.readyStateSnapshot = {
    save: save_ready_snapshot,
    clear: clear_ready_snapshot,
    metadata: () => snapshot_metadata,
};
</script>
