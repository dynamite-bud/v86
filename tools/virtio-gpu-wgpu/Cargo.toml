[package]
name = "virtio-gpu-wgpu"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1.24.0"
futures-channel = "0.3.31"
js-sys = "0.3.104"
naga = { version = "=30.0.0", features = ["wgsl-in"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "webgpu", "wgsl"] }


[dev-dependencies]
wasm-bindgen-test = "=0.3.77"