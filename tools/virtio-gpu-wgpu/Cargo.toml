[package]
name = "virtio-gpu-wgpu"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = "1.24.0"
futures-channel = "0.3.31"
futures-util = "0.3.31"
js-sys = "0.3.104"
naga = { git = "https://github.com/dynamite-bud/wgpu", rev = "7d5148d689f24101eb34c6af71b0071dcd113059", features = ["spv-in", "wgsl-in", "wgsl-out"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement", "Window"] }
wgpu = { git = "https://github.com/dynamite-bud/wgpu", rev = "7d5148d689f24101eb34c6af71b0071dcd113059", default-features = false, features = ["std", "webgpu", "wgsl"] }


[dev-dependencies]
wasm-bindgen-test = "=0.3.77"